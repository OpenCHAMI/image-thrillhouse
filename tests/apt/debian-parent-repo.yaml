# Parent build that adds an apt repository file in the correct location
# (/etc/apt/sources.list.d/*.list) with a user-pinned `signed-by=` keyring that
# ships in the base image. This exercises:
#   - repo path/extension validation accepting a .list file
#   - a user-supplied signed-by= being preserved (not clobbered) by the builder
#   - apt-get update/install actually reading the added repo
#
# It enables the jammy-proposed pocket on the Ubuntu archive the base image
# already trusts, so the build needs no external third-party network or extra
# keys. The stock ubuntu:22.04 sources already enable release/updates/backports/
# security for every component, so those all collide ("configured multiple
# times"); -proposed is the one standard pocket NOT enabled by default, so the
# added repo is genuinely new and warning-free. -proposed is marked NotAutomatic
# in the archive, so simply enabling it does not pull proposed package versions
# into the install below.
meta:
  name: ubuntu-parent-repo
  tags:
    - "22.04-repo"
  from: docker://ubuntu:22.04

layer:
  manager:
    name: apt
  repos:
    - path: /etc/apt/sources.list.d/ubuntu-proposed.list
      content: |
        deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://archive.ubuntu.com/ubuntu jammy-proposed main
  actions:
    install:
      packages:
        - vim

publish:
  - type: local
